<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble's Dreamscape</title>
    <style>
        /* 🌟 新增：颜色变量（用于暗黑模式切换） */
        :root {
            --bg-color: #faf8f5;
            --text-main: #333333;
            --text-sub: #666666;
            --card-bg: rgba(255, 255, 255, 0.3);
            --card-border: rgba(255, 255, 255, 0.6);
            --nav-color: #888;
            --nav-hover: #b5a3c9;
            --btn-bg: rgba(255,255,255,0.8);
            --btn-text: #333;
            --stat-color: #999;
        }

        /* 🌙 暗黑模式变量 */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #f0f0f0;
            --text-sub: #aaaaaa;
            --card-bg: rgba(30, 30, 30, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --nav-color: #aaaaaa;
            --nav-hover: #d4bfff;
            --btn-bg: rgba(50, 50, 50, 0.8);
            --btn-text: #f0f0f0;
            --stat-color: #666;
        }

        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh; height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden; position: relative;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* 背景梦幻光晕 */
        .aurora { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; z-index: 0; animation: float 10s infinite alternate ease-in-out; transition: opacity 0.5s; }
        [data-theme="dark"] .aurora { opacity: 0.3; } /* 暗色下极光变暗，更有氛围感 */
        
        .color-1 { width: 50vw; height: 50vw; max-width: 600px; max-height: 600px; background: #ffd6e0; top: -10%; left: -10%; }
        .color-2 { width: 60vw; height: 60vw; max-width: 700px; max-height: 700px; background: #d4e4ff; bottom: -20%; right: -10%; animation-delay: -3s; }
        .color-3 { width: 40vw; height: 40vw; max-width: 500px; max-height: 500px; background: #fef0b3; top: 40%; left: 30%; animation-delay: -6s; }

        /* 顶部极简导航 */
        .top-nav {
            position: absolute; top: 30px;
            z-index: 10; display: flex; gap: 25px; align-items: center;
        }
        .top-nav a {
            text-decoration: none; color: var(--nav-color);
            font-size: 0.9rem; letter-spacing: 0.2em;
            transition: color 0.3s;
        }
        .top-nav a:hover, .top-nav a.active { color: var(--nav-hover); font-weight: bold; }

        /* 🌙 新增：主题切换按钮 */
        .theme-toggle {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            opacity: 0.7; transition: opacity 0.3s, transform 0.3s;
        }
        .theme-toggle:hover { opacity: 1; transform: scale(1.1); }

        /* 主体内容区 */
        .container {
            position: relative; z-index: 1; text-align: center; padding: 60px 40px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            animation: fadeUp 1.5s ease-out; transition: all 0.5s ease;
        }

        /* 主标题 */
        h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 300; letter-spacing: 0.1em; color: var(--text-main); margin-bottom: 20px; position: relative; display: inline-block; transition: color 0.5s; }
        h1::before, h1::after { content: '✦'; font-size: 1.2rem; color: var(--nav-hover); position: absolute; top: 50%; transform: translateY(-50%); opacity: 0.8; }
        h1::before { left: -30px; } h1::after { right: -30px; }

        /* 副标题 */
        p { font-size: clamp(0.9rem, 2vw, 1.1rem); color: var(--text-sub); font-weight: 300; letter-spacing: 0.3em; line-height: 2.2; margin-top: 30px; padding-top: 30px; border-top: 1px solid var(--card-border); transition: color 0.5s, border-color 0.5s; }

        /* 按钮 */
        .enter-btn {
            display: inline-block; margin-top: 40px; padding: 12px 30px;
            background: var(--btn-bg); color: var(--btn-text); text-decoration: none;
            border-radius: 30px; font-size: 0.9rem; letter-spacing: 0.2em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease;
        }
        .enter-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 30px) scale(1.1); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <!-- 导航（加入了相册和月亮按钮） -->
    <nav class="top-nav">
        <a href="index.html" class="active">首页</a>
        <a href="articles.html">随笔</a>
        <a href="photos.html">相册</a>
        <a href="about.html">关于</a>
        <button class="theme-toggle" id="theme-toggle" title="切换模式">🌙</button>
    </nav>

    <!-- 背景柔和光晕 -->
    <div class="aurora color-1"></div>
    <div class="aurora color-2"></div>
    <div class="aurora color-3"></div>

    <!-- 主体内容 -->
    <div class="container">
        <h1>Bubble</h1>
        <p>澄净纯澈 · 剔透玲珑<br>空灵悠扬 · 恣意生长</p>
        <a href="articles.html" class="enter-btn">阅读文章 ✦</a>
    </div>

    <!-- 不蒜子访问量统计（颜色适配了暗黑模式） -->
    <div style="position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 0.8rem; color: var(--stat-color); letter-spacing: 0.1em; z-index: 10; transition: color 0.5s;">
        <span id="busuanzi_container_site_pv">本站总访问量 <span id="busuanzi_value_site_pv">...</span> 次</span>
        <span style="margin: 0 10px;">|</span>
        <span id="busuanzi_container_site_uv">访客数 <span id="busuanzi_value_site_uv">...</span> 人</span>
    </div>
    <script async src="//busuanzi.ibruce.info/busuanzi/2.0/busuanzi.pure.mini.js"></script>

    <!-- 🌟 暗黑模式控制逻辑 -->
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = '☀️';
        }

        toggleBtn.addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                toggleBtn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                toggleBtn.textContent = '☀️';
            }
        });
    </script>
</body>
</html>
