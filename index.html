<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini's Dreamscape</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            height: 100dvh; /* 适配手机动态视口 */
            background-color: #faf8f5; /* 奶油白底色，比纯白更有温度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景梦幻光晕（极光/液态感） */
        .aurora {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px); /* 模糊滤镜，制造柔和光感 */
            opacity: 0.6;
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
        }

        .color-1 {
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: #ffd6e0; /* 蜜桃粉 */
            top: -10%;
            left: -10%;
        }

        .color-2 {
            width: 60vw;
            height: 60vw;
            max-width: 700px;
            max-height: 700px;
            background: #d4e4ff; /* 晨空蓝 */
            bottom: -20%;
            right: -10%;
            animation-delay: -3s;
        }

        .color-3 {
            width: 40vw;
            height: 40vw;
            max-width: 500px;
            max-height: 500px;
            background: #fef0b3; /* 奶油黄 */
            top: 40%;
            left: 30%;
            animation-delay: -6s;
        }

        /* 主体内容区（极简毛玻璃卡片） */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); /* 高级毛玻璃效果 */
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            animation: fadeUp 1.5s ease-out;
        }

        /* 极简优雅的主标题 */
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem); /* 响应式字体大小 */
            font-weight: 300; /* 使用细体字，显得高级 */
            letter-spacing: 0.1em;
            color: #333333;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        /* 标题旁极细的装饰星芒 ✦ */
        h1::before, h1::after {
            content: '✦';
            font-size: 1.2rem;
            color: #b5a3c9;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.8;
        }
        h1::before { left: -30px; }
        h1::after { right: -30px; }

        /* 优雅的副标题 */
        p {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #666666;
            font-weight: 300;
            letter-spacing: 0.3em; /* 宽字间距，制造呼吸感 */
            line-height: 2.2;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(0, 0, 0, 0.05); /* 极细分割线 */
        }

        /* 平滑的漂浮动画 */
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* 内容入场动画 */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- 背景柔和光晕 -->
    <div class="aurora color-1"></div>
    <div class="aurora color-2"></div>
    <div class="aurora color-3"></div>

    <!-- 主体内容 -->
    <div class="container">
        <h1>Gemini</h1>
        <p>澄净纯澈 · 剔透玲珑<br>空灵悠扬 · 恣意生长</p>
    </div>
</body>
</html>
