<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini's Dreamscape</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh; height: 100dvh;
            background-color: #faf8f5;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden; position: relative;
        }

        /* 背景梦幻光晕（保持不变） */
        .aurora { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; z-index: 0; animation: float 10s infinite alternate ease-in-out; }
        .color-1 { width: 50vw; height: 50vw; max-width: 600px; max-height: 600px; background: #ffd6e0; top: -10%; left: -10%; }
        .color-2 { width: 60vw; height: 60vw; max-width: 700px; max-height: 700px; background: #d4e4ff; bottom: -20%; right: -10%; animation-delay: -3s; }
        .color-3 { width: 40vw; height: 40vw; max-width: 500px; max-height: 500px; background: #fef0b3; top: 40%; left: 30%; animation-delay: -6s; }

        /* 新增：顶部极简导航，不破坏原有排版 */
        .top-nav {
            position: absolute; top: 30px;
            z-index: 10; display: flex; gap: 30px;
        }
        .top-nav a {
            text-decoration: none; color: #888;
            font-size: 0.9rem; letter-spacing: 0.2em;
            transition: color 0.3s;
        }
        .top-nav a:hover, .top-nav a.active { color: #b5a3c9; font-weight: bold; }

        /* 主体内容区（极简毛玻璃卡片，保持不变） */
        .container {
            position: relative; z-index: 1; text-align: center; padding: 60px 40px;
            background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            animation: fadeUp 1.5s ease-out;
        }

        /* 极简优雅的主标题（保持不变） */
        h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 300; letter-spacing: 0.1em; color: #333333; margin-bottom: 20px; position: relative; display: inline-block; }
        h1::before, h1::after { content: '✦'; font-size: 1.2rem; color: #b5a3c9; position: absolute; top: 50%; transform: translateY(-50%); opacity: 0.8; }
        h1::before { left: -30px; } h1::after { right: -30px; }

        /* 优雅的副标题（保持不变） */
        p { font-size: clamp(0.9rem, 2vw, 1.1rem); color: #666666; font-weight: 300; letter-spacing: 0.3em; line-height: 2.2; margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(0, 0, 0, 0.05); }

        /* 动画（保持不变） */
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 30px) scale(1.1); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <!-- 这就是新增的导航，极其低调 -->
    <nav class="top-nav">
        <a href="index.html" class="active">首页</a>
        <a href="articles.html">随笔</a>
        <a href="about.html">关于</a>
    </nav>

    <!-- 背景柔和光晕 -->
    <div class="aurora color-1"></div>
    <div class="aurora color-2"></div>
    <div class="aurora color-3"></div>

    <!-- 主体内容 -->
    <div class="container">
        <h1>Gemini</h1>
        <p>澄净纯澈 · 剔透玲珑<br>空灵悠扬 · 恣意生长</p>
        <!-- 这里完全保留了你刚才设定的按钮样式 -->
        <a href="articles.html" style="display: inline-block; margin-top: 40px; padding: 12px 30px; background: rgba(255,255,255,0.8); color: #333; text-decoration: none; border-radius: 30px; font-size: 0.9rem; letter-spacing: 0.2em; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease;">
            阅读文章 ✦
        </a>
    </div>
</body>
</html>
