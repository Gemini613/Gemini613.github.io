        <p>拖延是惰性的积分，闭塞即主观忽视的累加，酿就的一切恶果源于那一次次的不经意。</p>
        
        <p>日常疲倦难悟心流，羡艳周围无数丰绩，感慨今日垂垂老矣，心魄大不如从前，迷惘徘徊触礁碰壁，但又积极穿梭于每一个热梗空间，活跃于每一段午夜时间，沉浸于每一座幻想国度，憧憬于每一片未抵桃源。</p>
        
        <p>亦成亦败，有的是一叶好强个性不甘屈从的灵魂方舟，却没有一个沉得住气的品性躯壳来摆渡，破局之法，俯拾即是，盼君清思。</p>
