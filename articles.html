<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随笔 - Gemini's Dreamscape</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #faf8f5;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh; position: relative; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; padding-top: 80px;
        }
        
        /* 极光背景 */
        .aurora { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; z-index: 0; animation: float 10s infinite alternate ease-in-out; }
        .color-1 { width: 50vw; height: 50vw; max-width: 600px; max-height: 600px; background: #ffd6e0; top: -10%; left: -10%; }
        .color-2 { width: 60vw; height: 60vw; max-width: 700px; max-height: 700px; background: #d4e4ff; bottom: -20%; right: -10%; animation-delay: -3s; }
        .color-3 { width: 40vw; height: 40vw; max-width: 500px; max-height: 500px; background: #fef0b3; top: 40%; left: 30%; animation-delay: -6s; }

        /* 导航 */
        .top-nav { position: absolute; top: 30px; z-index: 10; display: flex; gap: 30px; }
        .top-nav a { text-decoration: none; color: #888; font-size: 0.9rem; letter-spacing: 0.2em; transition: color 0.3s; }
        .top-nav a:hover, .top-nav a.active { color: #b5a3c9; font-weight: bold; }

        /* 内容容器 */
        .content-wrap { position: relative; z-index: 1; width: 100%; max-width: 700px; padding: 20px; }
        h2 { font-weight: 300; letter-spacing: 0.1em; margin-bottom: 40px; text-align: center; color: #333; font-size: 2rem; }

        /* 文章卡片列表 */
        .article-list { display: flex; flex-direction: column; gap: 20px; }
        .article-card {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); text-decoration: none; color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease; display: block;
        }
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.06); }
        .article-card h3 { font-weight: 400; font-size: 1.3rem; margin-bottom: 15px; color: #333; letter-spacing: 0.1em; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px; }
        .article-card p { font-size: 0.95rem; color: #666; margin-bottom: 15px; line-height: 1.8; text-align: justify; }
        .article-card .date { font-size: 0.85rem; color: #999; letter-spacing: 0.1em; text-align: right; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 30px) scale(1.1); } }
    </style>
</head>
<body>
    <!-- 极光背景 -->
    <div class="aurora color-1"></div>
    <div class="aurora color-2"></div>
    <div class="aurora color-3"></div>

    <!-- 导航 -->
    <nav class="top-nav">
        <a href="index.html">首页</a>
        <a href="articles.html" class="active">随笔</a>
        <a href="about.html">关于</a>
    </nav>

    <div class="content-wrap">
        <h2>随笔手记</h2>

        <div class="article-list">
            <a href="article1.html" class="article-card">
                <h3>清欢渡</h3>
                <!-- 这里是完整的随笔展示 -->
                <p>拖延是惰性的积分，闭塞即主观忽视的累加，酿就的一切恶果源于那一次次的不经意。</p>
                <p>日常疲倦难悟心流，羡艳周围无数丰绩，感慨今日垂垂老矣，心魄大不如从前，迷惘徘徊触礁碰壁，但又积极穿梭于每一个热梗空间，活跃于每一段午夜时间，沉浸于每一座幻想国度，憧憬于每一片未抵桃源。</p>
                <p>亦成亦败，有的是一叶好强个性不甘屈从的灵魂方舟，却没有一个沉得住气的品性躯壳来摆渡，破局之法，俯拾即是，盼君清思。</p>
                <div class="date">2026年11月10日</div>
            </a>
        </div>
    </div>
</body>
</html>
